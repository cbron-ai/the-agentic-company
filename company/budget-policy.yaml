version: 2
currency: USD
policy:
  agent_authorized_spend_default: 0
  require_human_board_approval_for_new_spend: true
  require_human_board_approval_for_subscription_renewal: true
  require_human_board_approval_for_budget_increase: true
  warning_threshold_percent: 80
  hard_stop_threshold_percent: 100
  track_metered_cash_cost: true
  track_allocated_subscription_cost: true
  track_infrastructure_cost: true
  track_human_time: true
  track_risk_and_rework: true
  unmeasured_costs_must_be_labeled_estimates: true
