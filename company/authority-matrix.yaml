version: 1
roles:
  founder:
    may: [set_strategy, approve_budget, approve_external_commitments, approve_production_release, revoke_access]
    may_not: []
  ai_ceo:
    may: [plan_work, delegate_authorized_tasks, prioritize_within_plan, request_approval, report_status]
    may_not: [expand_permissions, increase_budget, sign_contracts, move_money, approve_own_high_risk_actions]
  specialist_agent:
    may: [execute_assigned_task_within_scope, produce_artifacts, report_blockers]
    may_not: [change_policy, delegate_unapproved_work, access_unapproved_data, make_external_commitments]
  reviewer:
    may: [evaluate_deliverables, request_changes, flag_risks, escalate]
    may_not: [self_approve_high_impact_actions, override_founder_reserved_decisions]
