version: 2
default_policy: human_board_approval_for_reserved_or_high_impact_actions
roles:
  human_board: final_human_authority
  muse: ai_ceo_operating_coordinator
  claude: shadow_of_the_board_advisory_only
rules:
  - action: internal_research
    authority: authorized_worker
    approval: none_within_scope
  - action: draft_content
    authority: authorized_worker
    approval: before_external_publication_unless_exactly_preapproved
  - action: code_change
    authority: authorized_worker
    approval: required_review_before_merge
  - action: production_deployment
    authority: human_board
    approval: explicit_scoped
  - action: customer_message
    authority: human_board
    approval: explicit_or_exact_preapproved_scope
  - action: public_publication
    authority: human_board
    approval: exact_artifact_and_channel
  - action: new_spend
    authority: human_board
    approval: explicit_vendor_amount_period
  - action: budget_increase
    authority: human_board
    approval: explicit
  - action: legal_commitment
    authority: human_board_with_qualified_advice
    approval: human_only
  - action: money_movement
    authority: human_board
    approval: human_only
  - action: destructive_operation
    authority: human_board
    approval: explicit_with_recovery_plan
  - action: change_agent_permissions
    authority: human_board
    approval: explicit_and_audited
